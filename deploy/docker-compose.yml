services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-golem_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-golem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golem}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golem}"]
      interval: 5s
      timeout: 3s
      retries: 10

  wigolo:
    image: ghcr.io/knockoutez/wigolo:latest
    command: ["serve", "--host", "0.0.0.0", "--port", "3333"]
    ports:
      - "3333:3333"
    volumes:
      - wigolo_data:/data
    environment:
      WIGOLO_DATA_DIR: /data
      WIGOLO_SERVE_ALLOW_UNAUTHENTICATED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.28.4
    profiles: [rag]
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      QUERY_DEFAULTS_LIMIT: 20
      CLUSTER_HOSTNAME: node1
    ports:
      # Host 8081: the backend binds host 8080, so Weaviate must not collide.
      - "8081:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate

  minio:
    image: quay.io/minio/minio:latest
    profiles: [rag]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-golem}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-golem1234}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: [rag]
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-golem} ${MINIO_ROOT_PASSWORD:-golem1234} &&
      mc mb --ignore-existing local/golem-chatbot-documents"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: [app, full]
    ports:
      - "${APP_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      wigolo:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-golem}:${POSTGRES_PASSWORD:-golem}@postgres:5432/${POSTGRES_DB:-golem_chatbot}?sslmode=disable
      WEB_SEARCH_PROVIDER: wigolo
      WIGOLO_URL: http://wigolo:3333
      APP_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-0123456789abcdef0123456789abcdef}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    restart: unless-stopped

volumes:
  pgdata:
  weaviate_data:
  minio_data:
  wigolo_data:
